<script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) return;

        const mapaIds = {
            nroconstancia: 'lblnroconstancia',
            fecexp: 'lblfecexp',
            fecven: 'lblfecven',
            razsoc: 'lblrazsoc',
            numruc: 'lblnumruc',
            partreg: 'lblpartreg',
            modalidad: 'lblmodalidad',
            numresol: 'lblnumresol',
            EstadoVeh: 'lblEstadoVeh',
            placa: 'lblplaca',
            marca: 'lblmarca',
            carroceria: 'lblcarroceria',
            vin: 'lblvin',
            vin2: 'lblvin2',
            color: 'lblcolor',
            numasientos: 'lblnumasientos',
            ejes: 'lblejes',
            aniofab: 'lblaniofab',
            pesoseco: 'lblpesoseco',
            largo: 'lbllargo',
            pesobruto: 'lblpesobruto',
            ancho: 'lblancho',
            pesoutil: 'lblpesoutil',
            alto: 'lblalto'
        };

        function aplicarDatos(registro) {
            if (!registro) return;
            Object.keys(mapaIds).forEach(campo => {
                const el = document.getElementById(mapaIds[campo]);
                if (el && registro[campo] !== undefined) {
                    el.textContent = registro[campo];
                }
            });
        }

        // Busca primero en datos.json (sin caché) y si se abre en local usa localStorage
        fetch('datos.json?t=' + Date.now(), { cache: 'no-store' })
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                if (data && data[id]) {
                    aplicarDatos(data[id]);
                } else {
                    const local = JSON.parse(localStorage.getItem('registros_db') || '{}');
                    aplicarDatos(local[id]);
                }
            })
            .catch(() => {
                const local = JSON.parse(localStorage.getItem('registros_db') || '{}');
                aplicarDatos(local[id]);
            });
    })();
    </script>
